[project]
name = "concevez-et-deployez-un-systeme-rag"
version = "0.1.0"
description = "POC permettant de tester un nouveau chatbot intelligent capable de répondre à des questions utilisateurs sur les événements culturels à venir, en s'appuyant sur un système RAG (Retrieval-Augmented Generation) combinant recherche vectorielle et génération de réponse en langage naturel."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "datasets>=5.0.1",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.141.1",
    "langchain==0.3.19",
    "langchain-community==0.3.18",
    "langchain-google-vertexai==2.1.0",
    "langchain-mistralai==0.2.7",
    "mistralai>=2.10.1",
    "pandas>=3.0.6",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "ragas==0.2.14",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
