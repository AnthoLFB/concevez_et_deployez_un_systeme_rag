[project]
name = "concevez-et-deployez-un-systeme-rag"
version = "0.1.0"
description = "POC permettant de tester un nouveau chatbot intelligent capable de répondre à des questions utilisateurs sur les événements culturels à venir, en s'appuyant sur un système RAG (Retrieval-Augmented Generation) combinant recherche vectorielle et génération de réponse en langage naturel."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "datasets>=3.0.0",
    "faiss-cpu>=1.8.0",
    "fastapi>=0.115.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-mistralai>=0.2.0",
    "mistralai>=1.0.0",
    "pandas>=2.2.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
    "ragas>=0.4.0",
    "requests>=2.32.0",
    "sentence-transformers>=3.0.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
